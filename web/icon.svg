<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Descry">
  <!-- The Descry mark: one ring, one dot — an aperture. To descry is to make
       something out at a distance, which is what the product does to a story.

       Identical geometry to `.logo .mark` in index.html, `DescryMark` in the
       iOS app, and backend/ios/AppIcon/make_icon.py, which renders the app icon
       from these same ratios: outer diameter 0.605 of the canvas, stroke a
       ninth of that, dot a third of it. The stroke is one optical size heavier
       than the 18px nav mark so the tab favicon still reads at 16px.

       Replaces a blue-and-violet gradient sparkle that predated the paper
       redesign — the product had one identity on screen and a different one in
       the browser tab and on the home screen. -->
  <rect width="1024" height="1024" fill="#F7F4EE"/>
  <circle cx="512" cy="512" r="275.3" fill="none" stroke="#17150F" stroke-width="68.8"/>
  <circle cx="512" cy="512" r="103.2" fill="#17150F"/>
</svg>
