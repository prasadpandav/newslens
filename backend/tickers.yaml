# Company name -> ticker. The ONLY source of ticker symbols in the finance
# pipeline: the LLM proposes a company name, this file resolves it. A name that
# isn't here resolves to nothing and the org is kept without a symbol — never a
# guessed one. (See schemas/finance.py Ticker._no_unresolved_symbols.)
#
# Seeded by hand with what the configured finance feeds actually cover (RBI,
# SEBI, Mint, ET, BusinessLine, CNBC-TV18, The Hindu Business, plus the global
# CNBC/BBC feeds). Names the pipeline could not resolve are recorded on each
# story's entity table and reported by `run_finance_pipeline.py --unresolved`,
# which is the work queue for extending this file.
#
# Matching is exact on the normalised form: lowercased, punctuation dropped,
# legal suffixes (ltd/limited/inc/corp/plc/co/nv/sa/ag) removed. So
# "Reliance Industries Ltd." matches the "Reliance Industries" entry without an
# alias. Add aliases only for forms normalisation cannot reach ("RIL", "HDFC").
# Two entries that normalise identically are treated as ambiguous and BOTH stay
# unresolved, on purpose.

companies:
