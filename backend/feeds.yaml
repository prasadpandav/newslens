# Finance is India-weighted by design (markets, economy, corporate + CFO desk),
# with two global feeds for international context. Note this is the largest topic
# by feed count, so it contributes the most articles per Scout run.
finance:
  # PRIMARY — the regulator publishing the document itself, not a report of it.
  # `kinds.primary` in sources.yaml was empty, so every trend and story reported
  # "0 original documents" and the reader's "Where it's coming from" panel had
  # nothing but newsrooms in it. These are the cheapest honest way to change
  # that: a central bank and a market regulator saying something first-hand.
  - https://rbi.org.in/pressreleases_rss.xml
  - https://www.sebi.gov.in/sebirss.xml
  # global
  - https://www.cnbc.com/id/10000664/device/rss/rss.html
  # India — markets & money
  - https://www.livemint.com/rss/money
  - https://www.livemint.com/rss/companies
  - https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms
  - https://www.thehindubusinessline.com/markets/feeder/default.rss
  - https://www.thehindu.com/business/Economy/feeder/default.rss
  - https://www.thehindu.com/business/markets/feeder/default.rss
  # India — CNBC TV18 (economy / market / business / latest)
  - https://www.cnbctv18.com/commonfeeds/v1/cne/rss/economy.xml
  - https://www.cnbctv18.com/commonfeeds/v1/cne/rss/market.xml
  - https://www.cnbctv18.com/commonfeeds/v1/cne/rss/latest.xml
  # India — ET CFO desk (corporate finance / strategy / CFO tech)
  - https://cfo.economictimes.indiatimes.com/rss/lateststories
  - https://cfo.economictimes.indiatimes.com/rss/economy
  - https://cfo.economictimes.indiatimes.com/rss/strategy-operations
