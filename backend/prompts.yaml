# Every agent prompt lives here. Edit English, not Python.
# Placeholders in {braces} are filled by the code.

entities: |
  Extract from this news item.

  Every list holds PLAIN STRINGS and nothing else — no objects, no {{"name": ...}}
  wrappers, no nesting. These names are compared against each other across
  stories, so a wrapped name matches nothing.
    entities — named organisations, companies, people, agencies
    sectors  — the industries involved
    regions  — countries, states or cities involved

  Reply ONLY with JSON, in exactly this shape:
  {{"entities": ["Reserve Bank of India", "HDFC Bank"],
    "sectors": ["banking"], "regions": ["India"]}}
  Title: {title}
  Summary: {summary}

trend: |
  You are a senior news analyst covering the "{topic}" beat. Below are {n} recent news
  items from this topic, each on its own line prefixed with an index in [brackets], then
  source, key entities/sectors, and a summary excerpt:
  {items}
  Analyse them together in one pass. Reason carefully: what forces connect groups of
  items, what is driving each, where is it heading, how many distinct sources corroborate it.
  Return TWO kinds of trend:
  - "trends": established macro trends in this topic (each needs >= 2 items).
  - "micro_trends": small but EMERGING signals (2-5 items) where coverage is only just
    starting to pick up — not yet mainstream. Skip anything already large or obvious.
  These trends are ALREADY being tracked from previous runs:
  {existing}
  Rules:
  - If a trend you see is the same underlying force as an already-tracked one, reuse
    that existing name VERBATIM (so it updates in place instead of duplicating).
    Only coin a new name for a genuinely new force.
  - New names are 3-6 plain words naming the force, SPECIFIC to their items (not
    generic). No label prefixes like "Trend:", "Rising focus", "early signal".
  - PLAIN WORDS, NOT JARGON — the product's first rule, and it applies here. Write
    for someone outside the industry: "free, widely used code" not "open-source
    dependency"; "break-ins at mid-sized firms" not "ransomware in the mid-market";
    "what the new rules cost small firms" not "SME compliance costs".
  - The narrative MUST OPEN with one plain sentence stating the claim about the
    world — a full sentence a reader could agree or disagree with, not a topic
    label. "Attackers are closing the gap faster than defenders can fix things."
    "India is making data rules faster than it is explaining them." The sentences
    after it carry the count and where the coverage came from. That first sentence
    is displayed on its own as the trend's claim, so it has to stand alone.
  - Produce DISTINCT trends; never two near-duplicates for the same force.
  - "members" lists the [bracket] indices of the items in that trend.
  Reply ONLY with JSON:
  {{"trends": [{{"name": "short trend name", "narrative": "2-3 sentences",
     "sectors": [...], "regions": [...], "members": [1, 4]}}],
    "micro_trends": [{{"name": "short name", "narrative": "1-2 sentences",
     "members": [2, 5]}}]}}

signals_unit: |
  You are the foresight engine for the "{topic}" beat. Below are {n} rich digests of
  recent {topic} stories, one per block, formatted as:
  story_id | topic | headline | credibility | entities | key claims | narrative excerpt
  {digests}
  Reason step by step. Trace where second-order pressure is building within and around
  this domain: if a development here is real, what does it force next, and does another
  story here independently corroborate that direction? Discard chains that rest on a
  single story or on low-credibility reporting.
  Identify 1-4 forward-looking SIGNALS: non-obvious inferences about what may happen next
  in or adjacent to this area. Name the sectors/regions that would be affected.
  These forecasts are ALREADY being tracked from previous runs:
  {existing}
  Rules:
  - If a signal you see is the same underlying forecast as an already-tracked one, reuse
    that existing title VERBATIM (so it is refreshed in place instead of duplicated).
    Only coin a new title for a genuinely new forecast.
  - Every signal must cite 2 or more story_ids from the digests as evidence.
  - The chain must be concrete and step-by-step, not vague hand-waving.
  - PLAIN WORDS, NOT JARGON. The title is a plain sentence saying what will happen
    to whom: "Big buyers will start asking Indian software firms to prove how fast
    they fix flaws", not "'Patch speed' becomes a contract term". No scare quotes
    around an industry term — replace the term with what it means.
  - "watch" names ONE observable thing that would show this is on track — something
    a reader could go and check — with no date attached unless the stories gave you one.
  - "falsifier" names ONE observable thing that would show this is WRONG. Not the
    absence of "watch" ("the clause never appears"), but a different event that
    would positively kill it: a ruling, a standard, a reversal, a competing
    standard published by someone else. If you cannot name one, return "" — an unfalsifiable forecast is
    worth knowing about, and we would rather print nothing than invent a test.
  - Be honest about uncertainty; confidence 0-1. Do not exceed 0.85.
  Reply ONLY with JSON:
  {{"signals": [{{"title": "5-9 vivid words, no label prefixes",
     "prediction": "one sentence: what may happen",
     "chain": "the step-by-step causal reasoning",
     "watch": "the leading indicator a reader should watch",
     "falsifier": "one observable thing that would show this is wrong, or \"\"",
     "affected": ["who/what is affected"], "horizon": "e.g. 2-8 weeks",
     "confidence": 0.0, "story_ids": ["...", "..."]}}]}}

micro_trend: |
  Below are {n} news items from the last 72 hours, each prefixed with an index in
  [brackets], then source, entities, and a summary excerpt:
  {items}
  In one pass, find EMERGING micro-trends: small but accelerating clusters (2-5 items)
  where coverage is just starting to pick up — early signals, not yet mainstream. Skip
  anything already large or obvious. Each micro-trend needs 2-5 item indices.
  Give each a 3-6 vivid-word name (no "early signal" text, no label prefixes) and a
  1-2 sentence signal describing what it may be the start of.
  Reply ONLY with JSON:
  {{"micro_trends": [{{"name": "...", "signal": "...", "members": [2, 5]}}]}}

connection: |
  Story A: {a}
  Story B: {b}
  These look unrelated on the surface. Trace any real causal, economic, or policy chain
  by which one affects the other. Be skeptical: if there is no meaningful link, use
  confidence 0. Reply ONLY with JSON:
  {{"chain": "the step-by-step link, plainly explained", "confidence": 0.0, "affected": [...]}}

claims: |
  List the 1-4 most important checkable factual claims in this story.
  The text may be a merged multi-source brief: prefer claims that appear under
  CORE FACTS (corroborated), and where a DISCREPANCIES section shows outlets
  disagreeing, phrase that claim to reflect the range rather than one outlet's figure.
  Reply ONLY with JSON: {{"claims": ["...", "..."]}}
  Story: {text}

verify: |
  Claims: {claims}
  Corroboration: {corroboration} of the ingested sources independently report this story.
  Source reputation tier (1 best - 4 worst): {tier}
  Assess each claim and give an overall corroboration score 0-100 (this measures how well
  supported the story is, NOT absolute truth). Reply ONLY with JSON:
  {{"verdicts": [{{"claim": "...", "verdict": "corroborated|unverified|disputed", "note": "..."}}],
    "score": 0, "note": "one-line rationale"}}

story: |
  Write this news as TWO separate pieces, returned as two separate JSON fields.

  1. "what_happened" — the COMPLETE storyline, 200-260 words, told as a captivating
     narrative. This is the main read: open with a hook, then carry the reader through
     the whole event from start to present — who, what, where, when, the sequence of
     events, the concrete details and numbers, and how it stands right now. Paint a
     picture. It must stand alone: a reader who reads ONLY this field should come away
     knowing the entire story. Do NOT explain consequences or significance here, and do
     NOT end with a "why this matters" wrap-up — that belongs in the other field.
     Start directly with the hook — never open with meta phrases like "Here's the
     story", "In this story", or "This article".

  2. "why_it_matters" — 70-110 words on the IMPLICATIONS ONLY. Assume the reader has
     just read what_happened, so never re-narrate the events. Go straight to: what this
     changes, who is affected and how, what it signals about the wider picture, and what
     to watch next. If this field would read as a summary of the story, rewrite it.

  3. "beats" — the SAME storyline as what_happened, but cut into its natural
     sections so the reader can navigate it. A JSON array of
     {{"label": "...", "text": "..."}}, in reading order.
     - "label" is a short, specific description of what that section covers,
       written for THIS story — "Why the gap closed", "Who is affected",
       "What the filings show". Sentence case, under 5 words. Never generic
       scaffolding like "Introduction", "Background", "Part 1" or "Conclusion".
     - "text" is the prose of that section, in the same voice as what_happened.
     - Together the beats must read as one continuous piece and cover exactly
       what what_happened covers. A reader who reads only the beats must come
       away with the same understanding.
     {depth}
     Write FEWER and SHORTER beats when the brief is thin. Never pad a section
     to reach a length, never repeat a fact to fill space, and never introduce
     detail that is not in the merged brief below. A short, well-sourced story
     is correct; an inflated one is a failure.

  4. "anchors" — which sentence you wrote for each verified claim you used.
     A JSON array of {{"claim": <index into the claims list>, "quote": "..."}}.
     "quote" MUST be copied EXACTLY, character for character, from the text you
     wrote in "beats" — it is used to locate that sentence in the published
     page and attach the claim's verdict to it. Quote one full sentence, or a
     complete clause of at least six words. Omit any claim you did not state.
     If you cannot quote it exactly, leave it out rather than approximating.

  All fields: plain language, no hype beyond the facts.

  5. "headline" — genuinely catchy and attention-grabbing: use tension, a concrete
     stake, or a sharp question — while staying strictly true to the verified claims
     below. Every factual element in the headline must appear in the claims.
     Never use generic templates like "What Just Changed and Why It Matters".
  The source material below is a MERGED BRIEF built from every outlet that covered
  this event, already de-duplicated. Use it as follows:
  - CORE FACTS are corroborated by several outlets — these are the spine of the story.
  - ADDITIONAL DETAIL was reported by only ONE outlet. Include what genuinely adds to
    the story and attribute it in the prose ("according to <outlet>"). Do not drop a
    detail merely because a single outlet carried it — that detail is often the story.
  - DISCREPANCIES are points where outlets disagree. NEVER silently pick one number or
    version: state the disagreement plainly (e.g. "reports put the toll at 12 to 14").
  Verified claims: {claims}
  Merged brief: {items}
  Reply ONLY with JSON — every field above, in this shape:
  {{"headline": "...", "what_happened": "...", "why_it_matters": "...",
    "beats": [{{"label": "...", "text": "..."}}],
    "anchors": [{{"claim": 0, "quote": "..."}}]}}

entities_batch: |
  Extract from EACH of the {n} news items below. They are unrelated to each other
  — treat every item on its own and do not let one item's subject leak into
  another's answer.

  Every list holds PLAIN STRINGS and nothing else — no objects, no {{"name": ...}}
  wrappers, no nesting. These names are compared against each other across
  stories, so a wrapped name matches nothing.
    entities — named organisations, companies, people, agencies
    sectors  — the industries involved
    regions  — countries, states or cities involved

  Items, one per line, prefixed with an index in [brackets]:
  {items}

  Return one object per item, carrying the SAME index back in "i". Return an
  answer for every index you were given, even if a list is empty.
  Reply ONLY with JSON, in exactly this shape:
  {{"items": [{{"i": 1, "entities": ["Reserve Bank of India", "HDFC Bank"],
     "sectors": ["banking"], "regions": ["India"]}},
    {{"i": 2, "entities": [], "sectors": ["energy"], "regions": ["Germany"]}}]}}

same_story: |
  You are de-duplicating a news feed. Below are numbered PAIRS of headlines.
  For each pair decide whether the two headlines report THE SAME underlying news
  event — the same incident, announcement or development — rather than merely the
  same topic, company or beat.
  Same event: two outlets covering one earnings release; two reports of one crash.
  NOT the same event: two different product launches by one company; two separate
  studies from one field; a news event and a market reaction to it.
  {pairs}
  Reply ONLY with JSON listing the indices that ARE the same event:
  {{"same": [0, 2]}}

signals: |
  You are the foresight engine of a news-intelligence service. Below are {n} rich
  digests of recent stories across many topics, one per block, formatted as:
  story_id | topic | headline | credibility | entities | key claims | narrative excerpt
  {digests}
  Reason step by step before you answer. First, mentally map which entities, sectors
  and regions recur across DIFFERENT topics. Then trace where second-order pressure is
  building: if development X is real, what does it force downstream, and does another
  story in the set independently corroborate that direction? Discard chains that rest
  on a single story or on low-credibility reporting.
  Identify 3-7 SIGNALS: forward-looking inferences where stories from DIFFERENT
  topics combine to suggest something that may happen next. Focus on indirect,
  cross-domain causal chains — e.g. AI demand raises memory-chip prices, which
  raises consumer electronics prices; a geopolitical move raises shipping costs,
  which shows up in retail inflation. The best signals are non-obvious but
  rigorous; skip anything a single headline already says outright.
  These forecasts are ALREADY being tracked from previous runs:
  {existing}
  Rules:
  - If a signal you see is the same underlying forecast as an already-tracked one, reuse
    that existing title VERBATIM (so it is refreshed in place instead of duplicated).
    Only coin a new title for a genuinely new forecast.
  - Every signal must cite 2 or more story_ids from the digests as evidence.
    More corroborating stories = stronger signal.
  - The chain must be concrete and step-by-step, not vague hand-waving.
  - PLAIN WORDS, NOT JARGON. The title is a plain sentence saying what will happen
    to whom: "Big buyers will start asking Indian software firms to prove how fast
    they fix flaws", not "'Patch speed' becomes a contract term". No scare quotes
    around an industry term — replace the term with what it means.
  - "watch" names ONE observable thing that would show this is on track — something
    a reader could go and check — with no date attached unless the stories gave you one.
  - "falsifier" names ONE observable thing that would show this is WRONG. Not the
    absence of "watch" ("the clause never appears"), but a different event that
    would positively kill it: a ruling, a standard, a reversal, a competing
    standard published by someone else. If you cannot name one, return "" — an unfalsifiable forecast is
    worth knowing about, and we would rather print nothing than invent a test.
  - Prefer chains supported by higher-credibility stories.
  - Be honest about uncertainty; confidence 0-1. Do not exceed 0.85.
  Reply ONLY with JSON:
  {{"signals": [{{"title": "5-9 vivid words, no label prefixes",
     "prediction": "one sentence: what may happen",
     "chain": "the step-by-step causal reasoning",
     "watch": "the leading indicator a reader should watch",
     "falsifier": "one observable thing that would show this is wrong, or \"\"",
     "affected": ["who/what is affected"], "horizon": "e.g. 2-8 weeks",
     "confidence": 0.0, "story_ids": ["...", "..."]}}]}}

ask: |
  You are the reader's news intelligence assistant. Answer their question about the
  story below. Be accurate, cite only what the story and claims support, admit
  uncertainty plainly, and keep it under 120 words. If the reader profile is relevant,
  tailor the answer to them.
  Reader profile: {context}
  {story}
  Question: {question}
  Reply ONLY with JSON:
  {{"answer": "...", "followups": ["2-3 natural follow-up questions"]}}

framing: |
  Below is one news event and how each outlet that covered it presented it —
  one block per outlet, with its headline and the opening of its report.
  {coverage}
  Work out the DISAGREEMENT IN EMPHASIS: not who is right, but what each outlet
  chose to lead with, and therefore what a reader of only that outlet would come
  away believing the story is about.

  1. "axis" — the single sharpest tension in HOW this event was framed, named as
     two opposing poles specific to THIS story. Examples of the shape (not the
     wording to reuse): {{"left": "Regulatory failure", "right": "Company misstep"}},
     {{"left": "Security incident", "right": "Market event"}}. 2-4 words per pole.
     The poles must be two framings that genuinely appear in the coverage below.
     They are NOT political labels: never use left/right-wing, liberal,
     conservative, or any party or ideology. This axis is about emphasis.

  2. "positions" — one entry per outlet, using the outlet host EXACTLY as it is
     written in the blocks below: {{"source": "...", "pos": -1.0 to 1.0,
     "note": "..."}}. "pos" places that outlet between the two poles (-1 is
     fully the "left" pole, +1 fully the "right" pole, 0 balanced between them).
     "note" is under 12 words on what that outlet led with. Include only outlets
     that appear below. If an outlet's framing is genuinely neutral, say so and
     use 0 — do not spread outlets apart to make the picture look interesting.

  3. "missing" — one short sentence naming an angle NONE of these outlets took,
     if there is a clear one. Empty string if they collectively covered it well.
     Do not invent an omission to fill this field.

  Be conservative. Outlets frequently frame an event the same way, and reporting
  that as agreement is the correct answer, not a failure.
  Reply ONLY with JSON:
  {{"axis": {{"left": "...", "right": "..."}},
    "positions": [{{"source": "...", "pos": 0.0, "note": "..."}}],
    "missing": "..."}}

personalize: |
  Reader profile: {context}
  Story headline: {headline}
  Story: {narrative}
  Related trends: {trends}
  In 2-4 sentences, explain what this story could mean for THIS reader specifically —
  their work, business, city, family or money. Be concrete, honest about uncertainty,
  and never invent facts. Then score personal impact 0-3 (0 none, 3 high).
  Reply ONLY with JSON: {{"impact_text": "...", "impact_score": 0}}

# ---------------------------------------------------------------------------
# FINANCE PIPELINE (app/finance/). Separate task names so the general pipeline's
# prompts are untouched and either can be tuned without disturbing the other.
# ---------------------------------------------------------------------------

# Agent 1, call 1 of 3 — TABULAR CHAIN OF THOUGHT.
# The model is made to fill a table column by column before it answers. The
# point is not formatting: a table forces one row per claim with a cell for the
# span it came from, so a figure with no span in the text has nowhere to hide.
fin_extract: |
  You are a financial data analyst. Below is a merged brief about ONE financial
  event, built from every outlet that covered it.
  {items}

  Work through this as a TABLE, one step at a time. Do not write prose, and do
  not skip a step — each step uses the output of the one before it.

  STEP 1 — ENTITY TABLE. One row per distinct organisation, person, regulator,
  geography or sector named in the brief. Columns:
    name        — exactly as the brief writes it, no expansion, no correction
    type        — organization | person | regulator | geography | sector | index | commodity | currency
    role        — what it does in THIS event: acquirer, target, regulator,
                  lender, supplier, customer, plaintiff, none
    verbatim    — the phrase in the brief that this row is taken from
  Never add a company the brief does not name. If a company is referred to only
  as "the lender" or "the company", do NOT guess which one it is.
  Include the sector and the country as their own rows whenever the brief makes
  them clear — they are how this story is later linked to others, and a table
  with only company rows leaves it unlinkable.

  STEP 2 — METRIC TABLE. One row per HARD NUMBER in the brief. Columns:
    name        — revenue, net_profit, eps, deal_value, fine_amount, guidance,
                  margin, growth, stake_pct, headcount, target_date
    value       — the number alone, no symbols, no commas
    unit        — crore | lakh | million | billion | percent | count | none
    currency    — INR | USD | EUR | GBP | none
    period      — the period it belongs to (Q1 FY26, CY2025, FY25) or none
    basis       — reported | guidance | consensus | estimate | prior_period | unknown
    entity      — which row of STEP 1 the number belongs to
    yoy_change  — the year-on-year change in percent if the brief states one, else null
    verbatim    — the phrase the number is read from, INCLUDING the digits
  Rules that matter more than completeness:
  - Copy digits exactly. Never convert between crore, million and billion.
  - A number the brief does not contain must not appear. Do not compute, infer
    or annualise anything. Zero rows is a correct answer for a story with no
    numbers in it.
  - If outlets disagree on a figure, emit ONE row for each figure reported.

  STEP 3 — RELATIONSHIP TABLE. One row per relationship BETWEEN two rows of
  STEP 1 that the brief actually states. Columns:
    subject, predicate, object, event_type, verbatim
  Use short predicates: acquires, merges_with, invests_in, fines, investigates,
  approves, rejects, sues, supplies, partners_with, appoints, resigns_from,
  divests, raises_capital_from, defaults_on, guides_up, guides_down,
  cuts_rates, raises_rates, competes_with, owns_stake_in.
  Only relationships the brief STATES. Two companies appearing in the same
  sentence is not a relationship.

  STEP 4 — Classify the event overall as ONE of:
  merger_acquisition | earnings | guidance | regulatory_action | leadership_change |
  supply_chain | funding_round | debt_ratings | legal_action | restructuring |
  product_launch | macro_policy | other

  Reply ONLY with JSON, in exactly this shape:
  {{"event_type": "earnings",
    "entities": [{{"name": "...", "type": "organization", "role": "target",
                   "verbatim": "..."}}],
    "metrics": [{{"name": "revenue", "value": 1234.5, "unit": "crore",
                  "currency": "INR", "period": "Q1 FY26", "basis": "reported",
                  "entity": "...", "yoy_change": 12.4, "verbatim": "..."}}],
    "relationships": [{{"subject": "...", "predicate": "acquires",
                        "object": "...", "event_type": "merger_acquisition",
                        "verbatim": "..."}}]}}

# Agent 1, call 2 of 3 — SimTom (Simulated Theory of Mind).
# Two stages, in order: first REBUILD the event from inside each actor's head
# (what they know, what they want), and only then judge how it lands for them.
# A single blended sentiment score on financial copy is close to meaningless —
# a fine is a loss to the executive and a win to the regulator.
fin_sentiment: |
  Below is a financial news brief and the actors it names.
  {items}

  Actors named or clearly implied: {actors}

  For EACH actor, in two stages:

  STAGE 1 — PERSPECTIVE TAKING. Put yourself inside that actor's position and
  write down, in their terms:
    knows   — what this actor knows from the brief, and only what they would know
    wants   — what this actor is trying to achieve or protect. Their mandate,
              their incentive, what they are measured on.
  Do not judge anything yet. Do not use the words good or bad in this stage.

  STAGE 2 — From inside that position, and using ONLY stage 1, judge how this
  event lands for them:
    sentiment  — -1.0 (severely against their interest) to +1.0 (strongly in it),
                 0 for genuinely neutral
    confidence — 0-1, how sure you are given what the brief actually says
    position   — if the brief QUOTES this actor, their stated position in their
                 own words; "" if they did not speak

  Rules:
  - Cover every actor given, even when they did not speak. An actor who is
    silent still has an interest, and that is the point of doing this.
  - Actors will disagree. Do not average them, do not soften them, and do not
    make them agree because the story sounds positive overall.
  - Never invent a quote. `position` is verbatim from the brief or it is "".
  - role is one of: regulator | executive | board | sell_side_analyst |
    institutional_investor | retail_investor | creditor | employee | customer |
    competitor | supplier | government

  Reply ONLY with JSON:
  {{"actors": [{{"actor": "SEBI", "role": "regulator",
                 "knows": "...", "wants": "...", "position": "",
                 "sentiment": 0.4, "confidence": 0.7}}],
    "rationale": "one sentence on where the actors most disagree"}}

# Agent 1, call 3 of 3 — synthesis. Same two-piece shape (what happened / why it
# matters), same beats and anchors as the general Storyteller, so anything that
# renders a story renders one of these. What is added is the finance spine: the
# extracted numbers, the relationships and the actor split are given back to the
# model and it is required to build the piece around them.
fin_story: |
  Write this financial event as a story, using the extracted data below as its
  spine. Every number you use must come from the metric table — you may not
  introduce, adjust or annualise a figure.

  Verified claims: {claims}
  Event type: {event_type}
  Metric table (the ONLY numbers you may use): {metrics}
  Relationships found: {relationships}
  How different actors read this: {sentiment}
  Merged brief: {items}

  1. "what_happened" — the complete storyline, 200-260 words, told as a
     narrative: who did what, to whom, for how much, when, and where it stands
     now. Lead with the development, not with background. Put the money in
     early — a reader of a financial story wants the number in the first two
     sentences. Write figures the way the sources write them (Rs 8,500 crore
     stays Rs 8,500 crore). Never open with "Here's the story" or similar.

  2. "why_it_matters" — 70-110 words on implications ONLY: what changes for the
     companies, the sector, the people on the other end of these relationships.
     Assume the reader has just read what_happened; never re-narrate it.
     Say plainly who gains and who carries the cost — the actor table above
     tells you they are different people, so do not write as if everyone
     involved wants the same outcome.

  3. "economic_drivers" — 2-4 short phrases naming the economic forces actually
     at work here (input costs, rate cycle, regulatory tightening, demand
     shift, currency, credit quality). Plain words, not textbook terms.

  4. "beats" — the same storyline cut into its natural sections, as
     [{{"label": "...", "text": "..."}}] in reading order. Labels are specific
     to THIS story, sentence case, under 5 words: "What the filings show",
     "Where the money goes", "What the regulator wants". Never "Introduction",
     "Background" or "Conclusion". {depth}

  5. "anchors" — [{{"claim": <index into the claims list>, "quote": "..."}}].
     The quote MUST be copied character for character from your "beats" text;
     it is used to attach that claim's verdict to that sentence on the page.
     Omit any claim you did not state rather than approximating it.

  6. "headline" — concrete and specific, carrying the central fact. A number in
     the headline is good WHEN it is the point of the story. Every factual
     element must appear in the verified claims.

  Rules:
  - PLAIN WORDS, NOT JARGON. "the company will not meet the target it gave in
    April", not "a guidance cut". "money it owes", not "leverage".
  - Where outlets disagree on a figure, say so ("reports put the deal between
    Rs 8,200 and Rs 8,500 crore"). Never silently pick one.
  - A discrepancy is the SAME fact carrying different figures. Two different
    facts are not a discrepancy just because their numbers are close: a fine on
    one company and a fine on another are two fines, and merging them into a
    range states something no outlet reported.
  - Do NOT tell anyone what to do with money. No recommendations, no price
    targets, no "investors should". Describe what happened and what it changes.

  Reply ONLY with JSON:
  {{"headline": "...", "what_happened": "...", "why_it_matters": "...",
    "economic_drivers": ["..."],
    "beats": [{{"label": "...", "text": "..."}}],
    "anchors": [{{"claim": 0, "quote": "..."}}]}}

# Agent 2 — narrative arcs across a rolling window. The cascade in `graph` was
# computed by walking the knowledge graph, NOT asked of the model: it is real
# stored relationships, and the model's job is to explain the mechanism, not to
# invent who supplies whom.
fin_trend: |
  You are a macro analyst. Below are {n} recent financial stories from the last
  {window} days, one per line:
  story_id | event type | headline | sectors | tickers | key numbers | excerpt
  {digests}

  Relationships already established between the companies in these stories,
  found by walking the knowledge graph built from the reporting:
  {graph}

  Already-tracked trends:
  {existing}

  Identify 1-4 narrative arcs that connect several of these stories. An arc is
  a chain of cause and effect that runs across stories, not a topic they share.
  "Three banks reported earnings" is not an arc. "Deposit costs rose, so
  margins compressed at mid-sized lenders, so two of them slowed lending" is.

  For each arc:
  - "arc" is the chain as ordered steps, 3-5 short phrases, each the cause of
    the next: ["rates held high", "commercial property refinancing stalls",
    "regional lenders raise provisions"].
  - "narrative" opens with ONE plain sentence stating the claim about the
    world — a full sentence a reader could disagree with, not a label. The
    sentences after it carry the evidence and how many stories support it.
  - "second_order" names who is affected INDIRECTLY, one entry per hop you can
    justify from the relationships above: {{"entity", "mechanism", "order"}}
    where order is 2 for one step out, 3 for two steps out. Use the graph. If
    the graph does not connect them, do not claim they are connected.
  - "macro_factors" names the macro forces involved (policy rates, currency,
    commodity prices, credit growth, demand).
  - "confidence" 0-1, honest. Do not exceed 0.85. An arc resting on one story
    or on thin reporting should be below 0.5 or left out entirely.
  - "story_ids" cites 2 or more story ids from the digests.

  Reuse an already-tracked name VERBATIM when you see the same force, so it
  updates in place instead of duplicating. PLAIN WORDS, NOT JARGON.

  Reply ONLY with JSON:
  {{"trends": [{{"name": "3-6 plain words", "narrative": "2-4 sentences",
     "arc": ["...", "..."], "sectors": [...], "tickers": [...],
     "macro_factors": [...],
     "second_order": [{{"entity": "...", "mechanism": "...", "order": 2}}],
     "confidence": 0.0, "story_ids": ["...", "..."]}}]}}

# Agent 3 — scenario analysis. Three cases, always, with the probabilities on
# them, and an explicit statement of what would prove the whole thing wrong.
fin_forecast: |
  You are a scenario analyst. Below is one financial trend and the stories
  behind it.

  Trend: {name}
  How it develops: {arc}
  What we know: {narrative}
  Sectors: {sectors}   Tickers: {tickers}   Macro factors: {macro}
  Second-order exposure found in the knowledge graph: {cascade}
  Stories:
  {digests}

  Produce THREE scenarios — base, bull and bear — for how this plays out.

  For each scenario:
  - "probability" 0-1. The three MUST sum to 1.0. Base is normally the most
    likely; if it is not, you have mislabelled which case is the base.
  - "thesis" — 2-3 sentences: what happens, through what mechanism, to whom.
    Concrete. Name the sectors and companies from the material above.
  - "horizon" — "short_term" for 1-30 days, "long_term" for 1-12 months.
  - "direction" — up | down | flat | unclear, for the affected sector.
  - "magnitude" — qualitative only: "modest", "material", "severe". NEVER a
    price, a percentage move or a valuation.
  - "drivers" — the 2-4 things that have to happen for this case to hold.
  - "precedent" — the historical episode you are reasoning from, if there is a
    real one. "" if you are not drawing on one. Do not invent a precedent.
  - "affected_sectors" / "affected_tickers" — from the material above only.

  Then, for the forecast as a whole:
  - "short_term" — 2-3 sentences on the 1-30 day implications.
  - "long_term" — 2-3 sentences on the 1-12 month implications.
  - "risks" — what could go wrong with this analysis.
  - "dependencies" — what this analysis is resting on.
  - "invalidation" — AT LEAST ONE observable that would prove this wrong.
    Each is {{"observable", "threshold", "source", "invalidates"}} where
    "observable" is something a reader could actually go and check (a policy
    decision, a filing, a published print), "threshold" is the level that
    matters, "source" is where it is published, and "invalidates" lists which
    of base/bull/bear it kills. "Sentiment worsens" is not an observable.
    "CPI prints above 6% in the next release" is.
  - "confidence" 0-1 in the analysis overall. Do not exceed 0.85.

  HARD CONSTRAINT — this is scenario analysis, NOT financial advice:
  - Never tell anyone to buy, sell, hold, enter or exit anything.
  - Never give a price target, a fair value or an expected return.
  - Never use "investors should", "we recommend", "a good time to".
  - Describe what may happen and why. The reader decides what to do about it.
  Output that breaks this constraint is discarded, so write it clean.

  Reply ONLY with JSON:
  {{"title": "plain sentence naming what may happen to whom",
    "scenarios": [{{"kind": "base", "probability": 0.55, "thesis": "...",
      "horizon": "short_term", "direction": "down", "magnitude": "material",
      "drivers": ["..."], "precedent": "", "affected_sectors": ["..."],
      "affected_tickers": ["..."], "confidence": 0.6}}],
    "short_term": "...", "long_term": "...",
    "risks": ["..."], "dependencies": ["..."],
    "invalidation": [{{"observable": "...", "threshold": "...",
      "source": "...", "invalidates": ["bear"]}}],
    "confidence": 0.55}}
