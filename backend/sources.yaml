# Source reputation tiers used by the Verifier. 1 = wire/major, 4 = unknown.
# The document publishers below are tier 1 for the same reason they are `primary`
# in `kinds`: a regulator's own directive is not a report about an event, it IS
# the event. Left unlisted they would have scored tier 4 — the same as an unknown
# blog — and a story resting on a central bank's own release would have come out
# LESS corroborated than a wire write-up of it.
tier1: [reuters.com, apnews.com, bbc.co.uk, bbc.com,
        cisa.gov, rbi.org.in, sebi.gov.in, ec.europa.eu]
tier2: [aljazeera.com, cnbc.com, theverge.com, arstechnica.com, thehindu.com, sciencedaily.com]
tier3: [ndtv.com, feedburner.com, rechargenews.com]
# anything unlisted = tier 4

# ---------------------------------------------------------------- source kind
# A DIFFERENT axis from tier, and the two must not be conflated. Tier asks "how
# reliable is this outlet"; kind asks "what is its relationship to the story" —
# which is the question the reader's "Where it's coming from" panel answers, and
# why a vendor's own threat report is worth flagging even when the vendor is
# perfectly reputable.
#
#   primary     publishes the underlying document itself — regulators, courts,
#               CERTs, statistical agencies, company filings. This list was empty
#               for a long time, which was honest but meant every trend and story
#               reported "0 original documents" and the reader's "Where it's
#               coming from" panel showed newsrooms and nothing else. Four
#               genuine document publishers are now ingested (see feeds.yaml) and
#               listed here. Still no newsroom is ever added to this list to make
#               the number look better — a wire report OF a filing is a newsroom.
#   newsroom    independent editorial organisations.
#   trade       industry/sector press — covers an industry it is part of and
#               partly funded by, so an "interested party" in the design's sense.
#   aggregator  republishes or summarises others' reporting; also the feed-
#               delivery hosts, which are not publishers at all.
#
# Unlisted hosts resolve to "unknown" — never silently counted as a newsroom.
kinds:
  primary:
    - cisa.gov              # US CERT advisories — the advisory itself
    - rbi.org.in            # Reserve Bank of India press releases and directions
    - sebi.gov.in           # Indian market regulator orders and circulars
    - ec.europa.eu          # European Commission press corner
  newsroom:
    - bbc.co.uk
    - bbc.com
    - reuters.com
    - apnews.com
    - aljazeera.com
    - cnbc.com
    - cnbctv18.com
    - thehindu.com
    - thehindubusinessline.com
    - economictimes.indiatimes.com
    - livemint.com
    - theprint.in
    - ndtv.com
    - espn.com
    - arstechnica.com
    - theverge.com
    - engadget.com
    - techcrunch.com
    - wired.com
    - venturebeat.com
    - technologyreview.com
    - the-decoder.com
  trade:
    - rechargenews.com
  aggregator:
    - sciencedaily.com      # republishes institutional press releases
    - feedburner.com

# Which place a `local:` feed covers. "Local" is a promise about WHERE, and a
# topic label alone cannot keep it: the same word means Thane to one reader and
# nothing at all to another. Scout stamps each article with the place its feed
# covers, the Storyteller carries the commonest one onto the story, and the
# clients use it both to say which city a story is about and to put the reader's
# own city first.
#
# Keys are matched as substrings of the feed URL, longest first, so a more
# specific path wins over a broader one. A feed with no entry here still works —
# its stories are simply "Local" with no place named, which is honest.
places:
  "indianexpress.com/section/cities/thane": Thane
  "indianexpress.com/section/cities/pune": Pune
  "thehindu.com/news/cities/mumbai": Mumbai
  "hindustantimes.com/feeds/rss/cities/mumbai-news": Mumbai
  "hindustantimes.com/feeds/rss/cities/pune-news": Pune
  "freepressjournal.in/stories.rss?section=thane": Thane
