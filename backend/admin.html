<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Descry · Admin</title>
<style>
:root{--bg:#070B14;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09);--text:#E8ECF4;--text2:#9AA5B8;--accent:#4D9FFF;--ai:#7C5CFF;
  --trust:#3DDC97;--warn:#FFC24D;--bad:#FF5D73;--grad:linear-gradient(135deg,#4D9FFF,#7C5CFF)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif;
  min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(800px 500px at 85% -10%,rgba(77,159,255,.10),transparent 60%),
             radial-gradient(700px 500px at 5% 110%,rgba(124,92,255,.08),transparent 60%)}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:26px 20px 80px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:16px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text2);margin-bottom:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;color:#fff;background:var(--grad);
  padding:10px 16px;font-weight:600}
button.ghost{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
button:disabled{opacity:.5;cursor:default}
input{width:100%;padding:12px 14px;border-radius:10px;background:var(--surface2);
  border:1px solid var(--border);color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* login */
#login{max-width:400px;margin:12vh auto 0}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.logo img{width:40px;height:40px;border-radius:10px}
.logo b{font-size:20px}
#loginerr{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:18px}
.hint{color:var(--text2);font-size:12.5px;margin-top:14px;line-height:1.6}

/* dashboard */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat .n{font-size:26px;font-weight:700;font-family:ui-monospace,monospace;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:12px;color:var(--text2);margin-top:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:100px;font-size:12.5px;
  font-weight:600;background:var(--surface2);border:1px solid var(--border)}
.pill.ok{color:#A7F3D0;background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.3)}
.pill.warn{color:#FDE9BE;background:rgba(255,194,77,.12);border-color:rgba(255,194,77,.3)}
.pill.bad{color:#FFC9D2;background:rgba(255,93,115,.12);border-color:rgba(255,93,115,.32)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.st-ok{color:var(--trust)}.st-err{color:var(--bad)}.st-done{color:var(--accent)}
/* Diagnosis text: a wrong pipeline says WHY here, so it must read as prose, not
   as another stat tile. */
.note{margin:8px 0 12px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.55;
  color:#FDE9BE;background:rgba(255,194,77,.10);border:1px solid rgba(255,194,77,.28)}
.note div+div{margin-top:6px}
.actions button{margin:0 8px 8px 0}
select{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font:inherit}
#result{font-size:13px;color:var(--text2);margin-top:6px;min-height:18px}
.err-item{font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--border);color:var(--text2)}
.err-item b{color:var(--bad)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#101A30;border:1px solid var(--border);padding:11px 20px;border-radius:100px;font-size:13.5px;
  transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.muted{color:var(--text2);font-size:12.5px}

/* reports */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  padding:8px 15px;font-size:13.5px}
.tabs button.on{background:var(--surface2);color:var(--text);border-color:var(--accent)}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.rhead h2{margin-bottom:0}
.rhead .sp{flex:1}
.rhead select{padding:7px 10px;font-size:13px}
/* Pure-CSS bar chart: each row is a labelled track, no chart library needed. */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,190px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar .lbl{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{display:block;background:var(--surface2);border-radius:100px;height:9px;overflow:hidden}
/* block, not inline — an inline span ignores width/height and collapses to 0 */
.bar .fill{display:block;height:100%;border-radius:100px;background:var(--grad)}
.bar .val{font-family:ui-monospace,monospace;font-size:12px;color:var(--text2);min-width:44px;text-align:right}
/* Daily spark columns */
.spark{display:flex;align-items:flex-end;gap:2px;height:86px;margin-top:4px}
.spark .col{flex:1;min-width:3px;background:var(--grad);border-radius:3px 3px 0 0;opacity:.85}
.spark .col:hover{opacity:1}
.sparkx{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}
.who{display:flex;align-items:center}
.privacy{font-size:12px;color:var(--text2);margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="wrap">
  <div class="card">
    <div class="logo"><span style="width:36px;height:36px;border-radius:10px;background:var(--grad);display:inline-grid;place-items:center;font-size:18px">✦</span><b>Descry Admin</b></div>
    <label class="muted">Admin password</label>
    <input id="pw" type="password" placeholder="Your ADMIN_TOKEN" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')login()">
    <button style="width:100%;margin-top:12px" onclick="login()">Sign in</button>
    <div id="loginerr"></div>
    <div class="hint">The password is the <b>ADMIN_TOKEN</b> value set on your Render service
      (Environment tab). If you see “admin is disabled”, set that variable first, then sign in here.</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dash" class="wrap hidden">
  <div class="top">
    <h1>Descry · Admin</h1>
    <span id="peakpill"></span>
    <span class="sp"></span>
    <button class="ghost" onclick="refreshAll()">↻ Refresh</button>
    <button class="ghost" onclick="signout()">Sign out</button>
  </div>

  <div class="grid" id="stats"></div>

  <div class="card">
    <h2>Provider status</h2>
    <div class="row" id="providers"></div>
  </div>

  <div class="card actions">
    <h2>Actions</h2>
    <div class="row" style="margin-bottom:6px">
      <select id="stage">
        <option value="">Full pipeline (all stages)</option>
        <option value="scout">scout</option>
        <option value="dedupe">dedupe</option>
        <option value="entities">entities</option>
        <option value="trends">trends</option>
        <option value="connections">connections</option>
        <option value="stories">stories</option>
        <option value="signals">signals</option>
        <option value="personalize">personalize</option>
      </select>
      <button onclick="act('/admin/run', 'stage')">▶ Run pipeline</button>
      <button class="ghost" onclick="act('/admin/dedupe-trends')">Collapse duplicate trends</button>
      <button class="ghost" onclick="act('/admin/fix-topics')">Recompute story topics</button>
      <button class="ghost" onclick="confirmRebuild()">Rebuild all trends &amp; forecasts</button>
      <button class="ghost" onclick="findBlobStories()">Find multi-subject stories</button>
      <button class="ghost" onclick="findPlaceholderStories()">Rewrite placeholder stories</button>
      <button class="ghost" onclick="findMissingImages()">Backfill story images</button>
    </div>
    <div id="result"></div>
  </div>

  <!-- The finance pipeline is a SEPARATE process (FINANCE_IN_PROCESS=0) writing
       only to fin_* tables, so it is invisible in the panel above: its rows
       compete with the news pipeline's ~10-per-run inside one LIMIT 30 list, and
       "never ran" looks identical to "ran and found nothing". Its own card. -->
  <div class="card">
    <div class="rhead">
      <h2>Finance pipeline</h2>
      <span class="sp"></span>
      <select id="finstage">
        <option value="">All finance stages</option>
        <option value="fin_stories">fin_stories</option>
        <option value="fin_trends">fin_trends</option>
        <option value="fin_forecasts">fin_forecasts</option>
        <option value="fin_causal">fin_causal</option>
      </select>
      <button onclick="act('/admin/run-finance', 'finstage')">▶ Run finance</button>
      <button class="ghost" onclick="loadFinance()">↻ Check health</button>
    </div>
    <div id="finance"><span class="muted">Loading…</span></div>
  </div>

  <div class="card">
    <div class="rhead">
      <h2>Reports</h2>
      <span class="sp"></span>
      <select id="rdays" onchange="loadReport()">
        <!-- llm_usage buckets by UTC DAY, so this is today so far, not a rolling
             24h. Labelled for what it is rather than promising a precision the
             storage cannot deliver. -->
        <option value="1">Today (last 24h)</option>
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last year</option>
      </select>
    </div>
    <div class="tabs" id="rtabs">
      <button class="on" data-r="visitors" onclick="pickReport('visitors')">Visitors</button>
      <button data-r="traffic" onclick="pickReport('traffic')">Traffic</button>
      <button data-r="users" onclick="pickReport('users')">Signed-in users</button>
      <button data-r="llm" onclick="pickReport('llm')">LLM cost</button>
    </div>
    <div id="report"><span class="muted">Loading…</span></div>
  </div>

  <div class="card">
    <h2>Recent pipeline runs</h2>
    <div style="overflow-x:auto"><table id="runs"></table></div>
  </div>

  <div class="card">
    <h2>Recent errors</h2>
    <div id="errors"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = sessionStorage.getItem('descry_admin') || '';

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2600); }
function when(ts){ if(!ts) return '—'; const d=new Date(ts*1000);
  return d.toLocaleDateString([], {month:'short',day:'numeric'})+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

async function adminGet(path){
  return fetch(path, {headers:{'Authorization':'Bearer '+TOKEN}});
}
async function adminPost(path){
  return fetch(path, {method:'POST', headers:{'Authorization':'Bearer '+TOKEN}});
}

async function login(){
  const pw = $('#pw').value.trim();
  if(!pw){ $('#loginerr').textContent='Enter your admin password.'; return; }
  TOKEN = pw;
  const r = await adminGet('/admin/usage');
  if(r.status===200){ sessionStorage.setItem('descry_admin', pw); enter(); }
  else {
    // Show what the server actually said. The three admin failures used to
    // arrive as one message, so "wrong password" was printed even when the
    // real cause was that admin is off or the value carries a stray newline.
    let detail = '';
    try { detail = (await r.json()).detail || ''; } catch(e) {}
    $('#loginerr').textContent =
        r.status===401 ? (detail || 'Wrong password — check the ADMIN_TOKEN value on Render.')
      : r.status===403 ? (detail || 'Admin is disabled on the server. Set ADMIN_TOKEN in Render → Environment, then sign in.')
      : 'Could not reach the server (error '+r.status+'). Try again in a moment.';
  }
}
function signout(){ TOKEN=''; sessionStorage.removeItem('descry_admin');
  $('#dash').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#pw').value=''; }
function enter(){ $('#login').classList.add('hidden'); $('#dash').classList.remove('hidden'); refreshAll(); }

// Live panel only (stats, providers, recent runs, errors). This is what the
// auto-poll below calls: it is how a background job — a pipeline run, a story
// split, a retell batch — is seen to finish.
async function refresh(){
  const r = await adminGet('/admin/usage');
  if(r.status===401||r.status===403){ signout(); return; }
  if(!r.ok){ toast('Refresh failed ('+r.status+')'); return; }
  render(await r.json());
}

// Everything, reports included. Reports aggregate weeks of visit rows and move
// on a scale of days, so they are pulled only on an actual user action —
// sign-in, the ↻ button, a report tab, a date-range change — never on the timer.
async function refreshAll(){ await refresh(); loadFinance(); loadReport(); }

/* ===================== Reports ===================== */
let REPORT = 'visitors';
const nfm = n => (n ?? 0).toLocaleString();
const day = s => { const [y,m,d] = String(s||'').split('-');
  return d ? new Date(y, m-1, d).toLocaleDateString([], {month:'short', day:'numeric'}) : (s||''); };

function pickReport(which){
  REPORT = which;
  document.querySelectorAll('#rtabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.r === which));
  loadReport();
}

/* ================= Finance pipeline health =================
   The verdict does the work. "No finance stories changed" has four causes that
   are indistinguishable from an empty endpoint — never scheduled, no input,
   stage erroring, or genuinely quiet news — so the server names which one it is
   and this only has to render it. */
const FIN_VERDICT = {
  healthy:            ['ok',   'Running normally'],
  never_run:          ['bad',  'Never run'],
  stale:              ['bad',  'Stopped running'],
  failing:            ['bad',  'Failing'],
  no_input:           ['warn', 'No input articles'],
  running_but_empty:  ['warn', 'Ran, produced nothing'],
  disabled:           ['warn', 'Disabled'],
  gated:              ['warn', 'Skipped — news run failed'],
  starved:            ['warn', 'Skipped — no LLM provider free'],
};
const agoTxt = h => h == null ? 'never'
  : h < 1 ? Math.round(h*60)+'m ago' : h < 48 ? h.toFixed(1)+'h ago'
  : Math.round(h/24)+'d ago';

async function loadFinance(){
  const box = $('#finance');
  if(!box) return;
  const r = await adminGet('/admin/finance/health');
  if(r.status===401||r.status===403){ signout(); return; }
  if(!r.ok){ box.innerHTML = `<div class="muted">Couldn't load finance health (error ${r.status}).</div>`; return; }
  box.innerHTML = financeHTML(await r.json());
}

function financeHTML(d){
  const [cls, label] = FIN_VERDICT[d.verdict] || ['warn', d.verdict];
  const c = d.content || {}, g = d.graph || {}, s = d.scheduling || {};
  const problems = (d.problems||[]).length
    ? `<div class="note">` + d.problems.map(p => `<div>⚠ ${esc(p)}</div>`).join('') + `</div>`
    : '';
  const stages = Object.entries(d.last_runs||{}).map(([stage, r]) => `<tr>
      <td><code>${esc(stage)}</code></td>
      <td>${r ? `<span class="st-${r.status==='error'?'err':r.status==='done'?'done':'ok'}">${esc(r.status)}</span>` : '<span class="muted">never ran</span>'}</td>
      <td>${esc(agoTxt(r && r.ago_hours))}</td>
      <td>${r ? nfm(r.llm_calls) : '—'}</td>
      <td class="muted">${esc(r ? (r.detail||'').slice(0,120) : '')}</td></tr>`).join('');
  return `
    <div class="row" style="margin-bottom:10px">
      <span class="pill ${cls}">${esc(label)}</span>
      <span class="muted">runner: ${esc(s.runner||'?')} · every ${esc(String(s.interval_hours))}h</span>
    </div>
    ${problems}
    ${statGrid([
      ['Stories', nfm((c.fin_stories||{}).rows)],
      ['Trends', nfm((c.fin_trends||{}).rows)],
      ['Forecasts', nfm((c.fin_forecasts||{}).rows)],
      ['Causal chains', nfm((c.fin_causal_chains||{}).rows)],
      ['Graph nodes', nfm(g.nodes)],
      ['Graph edges', nfm(g.edges)],
      ['Articles in window', nfm((d.input||{}).eligible_articles)],
    ])}
    <div class="muted" style="margin:10px 0 4px">
      Newest story ${esc(agoTxt((c.fin_stories||{}).newest_age_hours))} ·
      newest trend ${esc(agoTxt((c.fin_trends||{}).newest_age_hours))} ·
      newest forecast ${esc(agoTxt((c.fin_forecasts||{}).newest_age_hours))} ·
      newest chain ${esc(agoTxt((c.fin_causal_chains||{}).newest_age_hours))}
    </div>
    <table><thead><tr><th>Stage</th><th>Status</th><th>Last run</th><th>LLM calls</th><th>Detail</th></tr></thead>
      <tbody>${stages}</tbody></table>`;
}

function statGrid(pairs){
  return `<div class="grid">` + pairs.map(([l,n]) =>
    `<div class="stat"><div class="n">${esc(String(n))}</div><div class="l">${esc(l)}</div></div>`
  ).join('') + `</div>`;
}

/* Horizontal bars, each scaled against the largest value in its own list.
   `fmt` formats the printed value — money needs more decimals than a count. */
function bars(rows, labelKey, valueKey, empty, fmt){
  if(!rows || !rows.length) return `<div class="muted">${esc(empty)}</div>`;
  const f = fmt || nfm;
  // Scale against the real largest value, with the divide-by-zero guard kept
  // OFF the reported figure. Clamping the max itself to 1 is invisible for
  // counts (they are integers) and wrong for money: a busiest day of $0.34
  // rendered as a third-height bar under a label reading "peak $1.00".
  const max = Math.max(...rows.map(r => r[valueKey] || 0), 0), scale = max || 1;
  return `<div class="bars">` + rows.map(r => {
    const v = r[valueKey] || 0;
    return `<div class="bar"><span class="lbl" title="${esc(r[labelKey])}">${esc(r[labelKey] || '—')}</span>
      <span class="track"><span class="fill" style="width:${Math.max(2, v/scale*100)}%"></span></span>
      <span class="val">${esc(f(v))}</span></div>`;
  }).join('') + `</div>`;
}

/* Daily columns. Bars are scaled to the busiest day; title shows exact numbers. */
function spark(daily, key, label, fmt){
  if(!daily || !daily.length) return `<div class="muted">No activity recorded yet.</div>`;
  const f = fmt || nfm;
  const max = Math.max(...daily.map(d => d[key] || 0), 0), scale = max || 1;
  const cols = daily.map(d =>
    `<div class="col" style="height:${Math.max(3, (d[key]||0)/scale*100)}%"
      title="${esc(day(d.day))}: ${esc(f(d[key]))} ${esc(label)}"></div>`).join('');
  return `<div class="spark">${cols}</div>
    <div class="sparkx"><span>${esc(day(daily[0].day))}</span>
      <span>peak ${esc(f(max))} ${esc(label)}/day</span>
      <span>${esc(day(daily[daily.length-1].day))}</span></div>`;
}

async function loadReport(){
  const box = $('#report');
  if(!box) return;
  const days = $('#rdays').value;
  box.innerHTML = `<span class="muted">Loading…</span>`;
  const r = await adminGet(`/admin/reports/${REPORT}?days=${encodeURIComponent(days)}`);
  if(r.status===401||r.status===403){ signout(); return; }
  if(!r.ok){ box.innerHTML = `<div class="muted">Couldn't load this report (error ${r.status}).</div>`; return; }
  const d = await r.json();
  box.innerHTML = REPORT==='visitors' ? visitorsHTML(d)
                : REPORT==='traffic'  ? trafficHTML(d)
                : REPORT==='llm'      ? llmHTML(d)
                : usersHTML(d);
}

function visitorsHTML(d){
  const returnRate = d.unique_devices ? Math.round(d.returning_devices / d.unique_devices * 100) : 0;
  return statGrid([
    ['Unique devices', nfm(d.unique_devices)],
    ['Page views', nfm(d.page_views)],
    ['New devices', nfm(d.new_devices)],
    ['Returning', `${nfm(d.returning_devices)} · ${returnRate}%`],
    ['Avg active days', d.avg_active_days ?? 0],
  ]) + `
  <h2 style="margin-top:6px">Unique devices per day</h2>
  ${spark(d.daily, 'devices', 'devices')}
  <div class="two" style="margin-top:20px">
    <div><h2>Most-read pages</h2>${bars(d.top_pages, 'path', 'views', 'No page views yet.')}</div>
    <div><h2>Where they came from</h2>${bars(d.referrers, 'ref', 'views', 'No external referrers yet — visitors are arriving directly.')}</div>
  </div>
  <div style="margin-top:20px"><h2>Countries</h2>${bars(d.countries, 'country', 'views', 'No country data yet.')}</div>
  <div class="privacy">Devices are counted with a random first-party id stored in the visitor's own browser.
    No IP addresses and no browser fingerprints are recorded. Raw visits are deleted automatically after the retention window.</div>`;
}

function trafficHTML(d){
  return statGrid([
    ['Total requests', nfm(d.total_requests)],
    ['Avg per day', nfm(d.avg_per_day)],
    ['Busiest day', d.busiest_day ? day(d.busiest_day.day) : '—'],
    ['Peak requests', d.busiest_day ? nfm(d.busiest_day.hits) : '—'],
  ]) + `
  <h2 style="margin-top:6px">Requests per day</h2>
  ${spark(d.daily, 'hits', 'requests')}
  <div style="margin-top:20px"><h2>Busiest endpoints</h2>

/* ===================== LLM cost =====================
   Money is not a count: a per-call cost is routinely a fraction of a cent, and
   rounding it to 2dp would print $0.00 next to a real bill. Small numbers keep
   enough significant digits to be non-zero; totals round to cents. */
function usd(n){
  n = Number(n||0);
  if(!n) return '$0';
  const s = n < 0.01 ? n.toFixed(6).replace(/0+$/,'').replace(/\.$/,'')
          : n < 1    ? n.toFixed(4)
          : n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return '$' + s;
}
const pct = (part, whole) => whole ? Math.round(part/whole*100) + '%' : '—';

function llmHTML(d){
  const life = d.lifetime || {};
  const models = d.by_model || [], tasks = d.by_task || [];

  // An unpriced model has real tokens and no rate, so it contributes $0 to
  // every total on this page. Say so loudly: a quietly understated bill is the
  // one failure mode a cost report must not have.
  const warn = (d.unpriced||[]).length ? `
    <div class="card" style="border-color:rgba(255,194,77,.35);background:rgba(255,194,77,.07);margin:0 0 16px">
      <b style="color:var(--warn)">${d.unpriced.length} model(s) have no configured price</b>
      <div class="muted" style="margin-top:6px">Their calls and tokens are counted below, but they add
        <b>$0</b> to every cost figure on this page — so the totals are a floor, not the bill.
        ${d.unpriced.map(m=>`<div class="mono">${esc(m.provider)}/${esc(m.model)} — ${nfm(m.calls)} calls, ${nfm(m.total_tokens)} tokens</div>`).join('')}
        Set rates in the <span class="mono">LLM_PRICES</span> environment variable as
        <span class="mono">{"provider/model": [input, output, cached_input]}</span> in $ per 1M tokens,
        then press <b>Recompute costs</b> below to apply them to history.</div>
    </div>` : '';

  const modelRows = models.map(m => `<tr>
    <td>${esc(m.provider)}</td>
    <td class="mono">${esc(m.model)}${m.priced ? '' : ' <span class="pill warn">unpriced</span>'}</td>
    <td>${nfm(m.calls)}</td>
    <td>${nfm(m.prompt_tokens)}</td>
    <td>${nfm(m.completion_tokens)}</td>
    <td>${nfm(m.total_tokens)}</td>
    <td>${nfm(m.avg_tokens_per_call)}</td>
    <td>${esc(usd(m.cost_usd))}</td>
    <td>${esc(usd(m.avg_cost_per_call))}</td>
    <td>${esc(pct(m.cost_usd, d.cost_usd))}</td>
    <td>${m.failures ? `<span class="st-err">${nfm(m.failures)} · ${m.failure_rate}%</span>` : '—'}</td>
    </tr>`).join('')
    || `<tr><td colspan="11" class="muted">No LLM calls recorded in this window.</td></tr>`;

  const taskRows = tasks.map(t => `<tr>
    <td class="mono">${esc(t.task)}</td>
    <td>${nfm(t.calls)}</td>
    <td>${nfm(t.total_tokens)}</td>
    <td>${nfm(t.avg_tokens_per_call)}</td>
    <td>${esc(usd(t.cost_usd))}</td>
    <td>${esc(usd(t.avg_cost_per_call))}</td>
    <td>${esc(pct(t.cost_usd, d.cost_usd))}</td>
    <td>${nfm(t.avg_latency_ms)} ms</td></tr>`).join('')
    || `<tr><td colspan="8" class="muted">Nothing recorded yet.</td></tr>`;

  const rateRows = (d.rates||[]).map(r => `<tr>
    <td>${esc(r.provider)}</td><td class="mono">${esc(r.model)}</td>
    <td>${r.input_per_1m==null ? '<span class="pill warn">none</span>' : esc(usd(r.input_per_1m))}</td>
    <td>${r.output_per_1m==null ? '—' : esc(usd(r.output_per_1m))}</td>
    <td>${r.cached_input_per_1m==null ? '—' : esc(usd(r.cached_input_per_1m))}</td>
    <td>${r.source==='configured' ? '<span class="pill ok">LLM_PRICES</span>'
        : r.source==='default' ? '<span class="pill">built-in default</span>'
        : '<span class="pill bad">not set</span>'}</td></tr>`).join('')
    || `<tr><td colspan="6" class="muted">No models used in this window.</td></tr>`;

  return warn + statGrid([
    [d.window_days === 1 ? 'Cost · today (UTC)' : `Cost · last ${d.window_days}d`,
     usd(d.cost_usd)],
    ['LLM calls', nfm(d.calls)],
    ['Tokens', nfm(d.total_tokens)],
    ['Avg cost / call', usd(d.avg_cost_per_call)],
    ['Avg tokens / call', nfm(d.avg_tokens_per_call)],
    ['Projected / month', usd(d.projected_monthly_usd)],
  ]) + `
  <div class="muted" style="margin:-6px 0 18px">
    All time: <b>${esc(usd(life.cost_usd))}</b> over ${nfm(life.calls)} calls and
    ${nfm(life.total_tokens)} tokens${life.tracking_since ? ', tracked since '+esc(when(life.tracking_since)) : ''}.
    Today so far: <b>${esc(usd((life.today||{}).cost_usd))}</b> · ${nfm((life.today||{}).calls)} calls.
    ${d.peak_cost_usd ? `Of the window's spend, <b>${esc(usd(d.peak_cost_usd))}</b> was billed at DeepSeek's 2× peak rate.` : ''}
    These survive restarts — the counters at the top of the page do not.
  </div>

  <h2>Spend per day</h2>
  ${spark(d.daily, 'cost_usd', 'spend', usd)}

  <h2 style="margin-top:22px">Per model</h2>
  <div style="overflow-x:auto"><table>
    <tr><th>Provider</th><th>Model</th><th>Calls</th><th>Input tok</th><th>Output tok</th>
        <th>Total tok</th><th>Avg tok/call</th><th>Cost</th><th>Avg $/call</th>
        <th>Share</th><th>Failed</th></tr>
    ${modelRows}
  </table></div>

  <div class="two" style="margin-top:22px">
    <div><h2>Cost by provider</h2>
      ${bars(d.by_provider, 'provider', 'cost_usd', 'No provider spend in this window.', usd)}</div>
    <div><h2>Calls by provider</h2>
      ${bars(d.by_provider, 'provider', 'calls', 'No calls in this window.')}</div>
  </div>

  <h2 style="margin-top:22px">Per pipeline task</h2>
  <div style="overflow-x:auto"><table>
    <tr><th>Task</th><th>Calls</th><th>Tokens</th><th>Avg tok/call</th><th>Cost</th>
        <th>Avg $/call</th><th>Share</th><th>Avg latency</th></tr>

  </table></div>

  <h2 style="margin-top:22px">Rate card</h2>

        <th>Cached input / 1M</th><th>Source</th></tr>
    ${rateRows}
  </table></div>
  <div class="row" style="margin-top:12px">
    <button class="ghost" onclick="repriceLLM()">Recompute costs from current rates</button>
    <span class="muted">Token counts are the stored record; cost is derived from these rates.
      Run this after changing <span class="mono">LLM_PRICES</span> to apply them to history.</span>
  </div>
  <div class="privacy">Counts every real provider call the service makes — the scheduled pipelines and
    on-demand reader requests alike — written through to the database as each call returns, so a
    deploy or an out-of-memory restart loses nothing. Built-in default rates are a starting point:
    confirm them against the provider's invoice before reporting a figure.</div>`;
}

async function repriceLLM(){
  if(!confirm('Recompute every stored cost from the rates currently configured?\n\n'+
              'Token counts are not touched. Use this after setting or correcting LLM_PRICES. '+
              'It rewrites history at today’s rates, so if a provider genuinely changed its '+
              'price mid-window, that change will be flattened.')) return;
  const r = await adminPost('/admin/llm-reprice');
  const j = await r.json().catch(()=>({}));
  toast(r.ok ? (j.status || 'Recomputed') : ('Error '+r.status));
  if(r.ok) loadReport();
}

function render(d){
  const u = d.session_llm_usage||{}, users = d.users||{}, price = d.pricing||{};
  // The spend tiles read the DATABASE totals, not the in-process counters. The
  // process-local ones are still shown (they are how you tell a run is alive),
  // but they are labelled "this process" and sit last, because they zero
  // themselves on every deploy and every OOM restart — which is exactly why
  // they cannot be the headline number anyone manages a budget against.
  const t = d.llm_totals || {}, today = t.today || {};
  const stats = [
    ['Total users', users.total ?? '—'],
    ['Google sign-ups', users.google_signed_up ?? '—'],
    ['LLM spend · all time', usd(t.cost_usd)],
    ['LLM spend · today', usd(today.cost_usd)],
    ['LLM calls · all time', nfm(t.calls)],
    ['Tokens · all time', nfm(t.total_tokens)],
    ['Calls this process', nfm(u.calls)],
    ['Failed · rate-limited', `${nfm(u.failed)} · ${nfm(u.rate_limited)}`],
  ];
  $('#stats').innerHTML = stats.map(([l,n])=>
    `<div class="stat"><div class="n">${esc(String(n))}</div><div class="l">${esc(l)}</div></div>`).join('');

  // DeepSeek peak pill
  const pk = $('#peakpill');
  if(price.deepseek_avoid_peak!==undefined){
    pk.innerHTML = price.deepseek_peak_now
      ? '<span class="pill warn">DeepSeek peak pricing active (2×)</span>'
      : '<span class="pill ok">DeepSeek off-peak</span>';
  } else pk.innerHTML='';

  // Providers
  const ps = d.provider_status||{};
  const provs = Object.keys(ps);
  $('#providers').innerHTML = provs.length ? provs.map(p=>{
    const b = ps[p].benched;
    return `<span class="pill ${b?'bad':'ok'}">${esc(p)} · ${b?('benched '+Math.ceil(ps[p].benched_for_seconds/60)+'m'):'ready'}</span>`;
  }).join('') : '<span class="muted">No provider activity yet this session.</span>';

  // Runs table
  const runs = d.recent_runs||[];
  $('#runs').innerHTML = '<tr><th>When</th><th>Stage</th><th>Status</th><th>Detail</th></tr>'+
    (runs.length ? runs.map(r=>{
      const cls = r.status==='error'?'st-err':r.status==='done'?'st-done':'st-ok';
      return `<tr><td class="mono muted">${esc(when(r.created_at))}</td><td>${esc(r.stage)}</td>
        <td class="${cls}">${esc(r.status)}</td><td class="muted">${esc(r.detail||'')}</td></tr>`;
    }).join('') : '<tr><td colspan="4" class="muted">No runs recorded yet.</td></tr>');

  // Config faults worth surfacing above the error list, because they repeat
  // forever until an env var changes and are otherwise just noise in the feed.
  const dead = (d.routing||{}).dead_models || {};
  const deadHTML = Object.keys(dead).length
    ? `<div class="err-item" style="border-left:3px solid #b04a3a">
         <b>Model retired by provider</b>
         <div class="mono">${Object.entries(dead).map(([k,v]) =>
            esc(k)+' — every task routed here fails until the model env var is corrected').join('<br>')}</div>
       </div>` : '';

  // Errors
  const errs = d.recent_errors||[];
  $('#errors').innerHTML = deadHTML + (errs.length ? errs.slice(0,12).map(e=>
    `<div class="err-item"><b>${esc(e.kind||'error')}</b> · ${esc(e.provider||'')} · ${esc(e.task||'')}
      <div class="mono">${esc(e.detail||'')}</div><div class="mono" style="opacity:.6">${esc(e.time||'')}</div></div>`
  ).join('') : (deadHTML ? '' : '<div class="muted">No recent errors — nice.</div>'));
}

// `stageFrom` is the ID of the <select> holding the stage — it used to be
// ignored, with '#stage' read unconditionally, which was invisible while the
// news pipeline was the only caller and would have sent a news stage name to
// the finance runner (a 400) the moment a second select existed.
async function act(path, stageFrom){
  let url = path;
  if(stageFrom){
    const el = $('#'+stageFrom);
    if(el && el.value) url += '?stage='+encodeURIComponent(el.value);
  }
  const finance = path.includes('finance');
  $('#result').textContent = 'Working…';
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);
  try{
    const r = await adminPost(url);
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ $('#result').textContent = 'Error '+r.status+': '+(j.detail||''); }
    else { $('#result').textContent = j.status || j.detail || JSON.stringify(j);
      toast('Started — results appear in Recent runs'); }
  }catch(e){ $('#result').textContent = 'Request failed — is the server awake?'; }
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);
  setTimeout(refresh, 1500);
  // A finance run changes nothing the live panel shows, so its own card has to
  // be re-read or the run looks like it did nothing.
  if(finance) setTimeout(loadFinance, 2000);
}
function confirmRebuild(){
  if(confirm('Rebuild ALL trends and forecasts from scratch? This deletes the current ones and recomputes them (uses LLM budget). Existing stories are re-linked.'))
    act('/admin/rebuild-intel');
}

// Stories written before stories were split one-per-event can hold dozens of
// unrelated articles merged under one trend. This previews them (dry run) —
// splitting happens IN PLACE (see /admin/split-blob-stories in main.py): the
// largest event keeps the original id/headline/bookmarks, the rest become new
// stories with a plain title that upgrades automatically once that event gets
// fresh coverage. Nothing is ever deleted.
async function findBlobStories(){
  $('#result').textContent = 'Scanning…';
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);
  try{
    const r = await adminPost('/admin/split-blob-stories?dry_run=true');
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ $('#result').textContent = 'Error '+r.status+': '+(j.detail||''); }
    else if(!j.matched){ $('#result').innerHTML = '<span class="muted">No oversized stories found.</span>'; }
    else {
      const list = j.stories.map(s=>
        `<div class="mono">${esc(String(s.articles))} articles, `+
        `${esc(String(s.splits_into))} distinct events — ${esc(s.headline)}</div>`).join('');
      $('#result').innerHTML =
        `<div>${j.matched} oversized ${j.matched===1?'story':'stories'} found, `+
        `~${j.events_created} new stories would be split out:</div>`+
        `<div style="margin:8px 0;max-height:220px;overflow:auto">${list}</div>`+
        `<button class="ghost" onclick="confirmSplitBlobStories(${j.matched})">`+
        `Split ${j.matched} in place</button>`;
    }
  }catch(e){ $('#result').textContent = 'Request failed — is the server awake?'; }
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);
}
function confirmSplitBlobStories(n){
  if(confirm(`Split ${n} oversized story row(s) into one story per event? Nothing is deleted: `+
             `each keeps its largest event under the original id (bookmarks stay valid), and the `+
             `rest become new stories with a plain title that upgrades to a proper headline once `+
             `that event gets fresh coverage.`))
    applySplitBlobStories();
}
// Stories created by a split carry stand-in text until they are written properly.
// This reports how many are waiting, then rewrites the highest-ranked batch —
// LLM budget, so it is capped and resumable rather than one giant run.
async function findPlaceholderStories(){
  $('#result').textContent = 'Checking…';
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);
  try{
    const r = await adminPost('/admin/retell-stories?dry_run=true');
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ $('#result').textContent = 'Error '+r.status+': '+(j.detail||''); }
    else if(!j.pending){ $('#result').innerHTML = '<span class="muted">No placeholder stories — all have written copy.</span>'; }
    else {
      const list = j.stories.slice(0,20).map(s=>
        `<div class="mono">${esc(String(s.articles))} article(s) — ${esc(s.headline)}</div>`).join('');
      $('#result').innerHTML =
        `<div>${j.pending} ${j.pending===1?'story':'stories'} still have placeholder text. `+
        `Rewriting the top ${j.would_repair_now} now (uses LLM budget; run again for the rest):</div>`+
        `<div style="margin:8px 0;max-height:200px;overflow:auto">${list}</div>`+
        `<button class="ghost" onclick="applyRetell()">Rewrite ${j.would_repair_now} now</button>`;
    }
  }catch(e){ $('#result').textContent = 'Request failed — is the server awake?'; }
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);
}
/* Story artwork for articles ingested before the image feature existed. Feed
   entries aren't kept after ingest, so this re-reads the feeds and matches on
   article URL — which naturally limits it to the most recent runs' articles. */
async function findMissingImages(){
  $('#result').textContent = 'Scanning feeds…';
  try{
    const r = await adminPost('/admin/backfill-images?dry_run=true');
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ $('#result').textContent = 'Error '+r.status+': '+(j.detail||''); return; }
    if(!j.articles_matched){
      $('#result').textContent = 'Nothing to backfill — every article the feeds still '
        + 'carry already has artwork ('+j.feed_entries_with_images+' feed entries scanned).';
      return;
    }
    $('#result').innerHTML = '<b>'+j.articles_matched+'</b> articles can be given artwork '
      + '(from '+j.feed_entries_with_images+' feed entries with images).<br>'
      + 'Stories built from them get the highest-resolution image across their sources.<br><br>'
      + '<button class="ghost" onclick="applyBackfillImages()">Apply</button>';
  }catch(e){ $('#result').textContent = 'Request failed — is the server awake?'; }
}
/* Applying runs in the BACKGROUND (it re-reads every feed, then writes
   hundreds of rows), so this returns as soon as the job is queued and the
   outcome shows up in Recent runs as stage='backfill_images'. It used to write
   synchronously inside the request, which held SQLite's writer lock across all
   40 feed fetches and 500'd once the batch got big. */
async function applyBackfillImages(){
  $('#result').textContent = 'Starting…';
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);
  try{
    const r = await adminPost('/admin/backfill-images?dry_run=false');
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ $('#result').textContent = 'Error '+r.status+': '+(j.detail||''); }
    else if(j.started === false){ $('#result').textContent = j.status || 'Busy — retry shortly.'; }
    else { $('#result').textContent = j.status || 'Started.';
      toast('Started — results appear in Recent runs'); }
  }catch(e){ $('#result').textContent = 'Request failed — is the server awake?'; }
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);
  setTimeout(refresh, 2500);
}
async function applyRetell(){
  $('#result').textContent = 'Starting…';

    else { $('#result').textContent = j.status || j.detail || JSON.stringify(j);
      toast('Started — results appear in Recent runs'); }
  }catch(e){ $('#result').textContent = 'Request failed — is the server awake?'; }
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);

}

async function applySplitBlobStories(){
  $('#result').textContent = 'Starting…';
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);
  try{
    // Runs as a background job (like Rebuild all trends & forecasts) — a batch
    // covering a dozen-plus oversized stories is too much writing to do inside

    // below for stage="split_blob_stories" to see it finish.
    const r = await adminPost('/admin/split-blob-stories?dry_run=false');
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ $('#result').textContent = 'Error '+r.status+': '+(j.detail||''); }
    else { $('#result').textContent = j.status || j.detail || JSON.stringify(j);
      toast('Started — results appear in Recent runs'); }
  }catch(e){ $('#result').textContent = 'Request failed — is the server awake?'; }
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);
  setTimeout(refresh, 1500);
}

// Auto-refresh the live panel every 30 minutes while actually watching it.
// `refresh` (not refreshAll) so the timer never re-runs the reports' multi-week
// aggregation, and document.hidden so a forgotten background tab stops polling
// a 512MB instance indefinitely.
setInterval(()=>{
  if(document.hidden) return;
  if(!$('#dash').classList.contains('hidden')) refresh();
}, 30 * 60 * 1000);

// Boot: if a token is already saved this session, go straight in.
if(TOKEN){ adminGet('/admin/usage').then(r=>{ if(r.status===200) enter(); else signout(); }); }
